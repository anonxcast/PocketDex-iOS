name: PocketDex
options:
  bundleIdPrefix: com.anonxcast
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
targets:
  PocketDex:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Native
        compilerFlags: "-fno-objc-arc"
        excludes:
          # #included by wide_gb/pk_wide_gb.c, not built or bundled on their own
          - "wide_gb/*.inc"
      # PokeDaisy WIDE / EXPAND (rebuild overworld past the GBA/GB frame).
      # GBA: upstream's v1.5.0.1 pk_wide.c. Game Boy: v1.5.1's pk_wide_gb.c in Native/wide_gb
      # (picked up by the Native path above) — adds Polished Crystal 3.2.3 and German Crystal.
      - path: ../upstream/app/src/main/cpp/pk_wide.c
        compilerFlags: "-fno-objc-arc"
      - path: Resources/Assets.xcassets
      - path: Resources/Fonts/IBMPlexSans-Regular.otf
        buildPhase: resources
      - path: Resources/Fonts/IBMPlexSans-Medium.otf
        buildPhase: resources
      - path: Resources/Fonts/IBMPlexSans-SemiBold.otf
        buildPhase: resources
      - path: Resources/Fonts/IBMPlexSans-Bold.otf
        buildPhase: resources
      - path: Resources/Fonts/IBMPlexMono-Medium.otf
        buildPhase: resources
      - path: Resources/Fonts/PressStart2P-Regular.ttf
        buildPhase: resources
      - path: Resources/Fonts/Silkscreen-Regular.ttf
        buildPhase: resources
      - path: Resources/Fonts/VT323-Regular.ttf
        buildPhase: resources
      - path: Resources/SpeciesIcons
        buildPhase: resources
        type: folder
      - path: Resources/ItemIcons
        buildPhase: resources
        type: folder
      - path: Resources/LearnsetsNational.bin
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anonxcast.pocketdex
        PRODUCT_NAME: PocketDex
        MARKETING_VERSION: "0.10.223"
        CURRENT_PROJECT_VERSION: "302"
        DEVELOPMENT_TEAM: 5TNX7VB7Z6
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PocketDex-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Native
          - $(SRCROOT)/Native/android_shim
          - $(SRCROOT)/../upstream/app/src/main/cpp
          - $(SRCROOT)/../upstream/app/src/main/cpp/nds
          - $(SRCROOT)/../upstream/third_party/mgba/include
          - $(SRCROOT)/../upstream/third_party/mgba/src
          - $(SRCROOT)/../upstream/third_party/melonds/src
          - $(SRCROOT)/../build/mgba-ios/include
          - $(SRCROOT)/../build/mgba-ios
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../build/mgba-ios/Release-iphoneos
          - $(SRCROOT)/../build/melonds-ios/Release-iphoneos
        OTHER_LDFLAGS:
          - -lmgba
          - -lpknds
          - -lcore
          - -lteakra
          - -lz
          - -lc++
        OTHER_CFLAGS:
          - -DM_CORE_GBA
          - -DM_CORE_GB
          - -DUSE_PTHREADS
          - -DARCHITECTURE_ARM64=1
          - -Wno-unused-parameter
          - -Wno-unused-function
          - -Wno-unused-variable
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PocketDex
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true
        UIRequiresFullScreen: false
        UIAppFonts:
          - IBMPlexSans-Regular.otf
          - IBMPlexSans-Medium.otf
          - IBMPlexSans-SemiBold.otf
          - IBMPlexSans-Bold.otf
          - IBMPlexMono-Medium.otf
          - PressStart2P-Regular.ttf
          - Silkscreen-Regular.ttf
          - VT323-Regular.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTExportedTypeDeclarations: []
        CFBundleDocumentTypes:
          - CFBundleTypeName: ROM or Delta Skin
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.item
            CFBundleTypeRole: Viewer
            CFBundleTypeExtensions:
              - gba
              - gbc
              - gb
              - nds
              - zip
              - 7z
              - deltaskin
        LSApplicationCategoryType: public.app-category.games
        NSMotionUsageDescription: Controller motion may be used for gameplay.
        GOOGLE_OAUTH_CLIENT_ID: 948496686981-ig6dcahkkc1l2t8lr1qq1co85jsn3534.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLName: Google OAuth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.948496686981-ig6dcahkkc1l2t8lr1qq1co85jsn3534
schemes:
  PocketDex:
    build:
      targets:
        PocketDex: all
    run:
      config: Release
    archive:
      config: Release
